server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Application React (SPA) : toute route inconnue retombe sur index.html,
    # le routage se fait côté client (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pas de cache sur index.html pour que les mises à jour soient visibles
    # immédiatement ; les assets buildés (hash dans le nom) sont mis en cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
