services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lubrimanager}
      POSTGRES_USER: ${POSTGRES_USER:-lubrimanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
    volumes:
      - lubrimanager_pgdata:/var/lib/postgresql/data
    ports:
      # Exposé sur 5433 pour ne pas entrer en conflit avec un PostgreSQL déjà
      # installé en local sur le poste (port 5432).
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lubrimanager} -d ${POSTGRES_DB:-lubrimanager}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-lubrimanager}
      DB_USER: ${POSTGRES_USER:-lubrimanager}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
      JWT_SECRET: ${JWT_SECRET:?Définissez JWT_SECRET dans .env (32 caractères minimum)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Définissez ADMIN_PASSWORD dans .env}
      # Sans effet une fois le premier compte admin créé (idempotent) ; passez
      # à false après la mise en place initiale si vous préférez le désactiver.
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-true}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./desktop
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  lubrimanager_pgdata:
